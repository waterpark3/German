<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドイツ語単語帳</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;700&family=Noto+Sans+JP:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Fraunces', '"Noto Sans JP"', 'sans-serif'],
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        mono: ['"Space Mono"', '"Noto Sans JP"', 'monospace'],
                    },
                    colors: {
                        slate: { 50: '#faf9f8', 100: '#f5f4f1', 200: '#eae8e4', 300: '#dfdbd5', 400: '#cecdc9', 500: '#a3a19b', 600: '#7e7c75', 700: '#64625b', 800: '#4e4c47', 900: '#3d3c38' },
                        amber: { 50: '#fcfcfc', 100: '#f7f7f7', 200: '#f2f2f2', 300: '#ebebeb', 400: '#e5e5e5', 500: '#4e4c47', 600: '#3d3c38', 700: '#2b2a27', 800: '#1a1917', 900: '#000000' }
                    }
                }
            }
        }
    </script>

    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        #card-inner.flipped { transform: rotateY(180deg); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans selection:bg-amber-200">

    <!-- ============================================== -->
    <!-- 画面1: ファイルアップロード (ベースデータ) -->
    <!-- ============================================== -->
    <div id="upload-section" class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-md w-full text-center">
            <div class="w-16 h-16 bg-slate-50 border border-slate-200 rounded-full flex justify-center items-center mx-auto mb-6 text-amber-600">
                <i data-lucide="book-open" class="w-8 h-8"></i>
            </div>
            <h1 class="font-display text-2xl font-bold text-slate-800 mb-2">ドイツ語単語帳</h1>
            <p class="text-sm font-bold text-slate-500 mb-8">お持ちの単語データを読み込みます</p>
            
            <label class="block w-full cursor-pointer bg-slate-50 border-2 border-dashed border-slate-300 hover:border-amber-600 rounded-xl p-8 transition-colors group">
                <input type="file" accept=".js,.json,.txt" class="hidden" onchange="handleFileUpload(event)">
                <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-400 mx-auto mb-3 group-hover:scale-110 transition-transform duration-300"></i>
                <span class="block font-bold text-slate-600">ファイルを選択</span>
                <span class="block text-xs font-bold text-slate-400 mt-2">.js または .json</span>
            </label>
            
            <div id="upload-error" class="mt-6 text-amber-700 bg-amber-50 border border-amber-200 p-3 rounded-lg text-sm font-bold hidden text-left flex items-start gap-2">
                <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
                <span id="upload-error-text"></span>
            </div>
        </div>
    </div>


    <!-- ============================================== -->
    <!-- 画面2: 単語帳アプリ -->
    <!-- ============================================== -->
    <div id="app-section" class="min-h-screen flex flex-col hidden">
        <header class="bg-white border-b border-slate-200 p-3 sticky top-0 z-20 shadow-sm flex justify-between items-center">
            <h1 class="font-display text-lg font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="book-open" class="text-amber-600 w-5 h-5"></i>
                <span class="hidden sm:inline">ドイツ語単語帳</span>
            </h1>
            
            <!-- モード切替 -->
            <div class="flex gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                <button id="mode-card-btn" onclick="switchMode('card')" class="px-3 py-1.5 rounded-md bg-white shadow-sm font-bold text-sm text-slate-800 transition-all flex items-center gap-1.5">
                    <i data-lucide="gallery-horizontal-end" class="w-4 h-4"></i> カード
                </button>
                <button id="mode-list-btn" onclick="switchMode('list')" class="px-3 py-1.5 rounded-md text-slate-500 font-bold text-sm hover:text-slate-700 transition-all flex items-center gap-1.5">
                    <i data-lucide="list" class="w-4 h-4"></i> 一覧
                </button>
            </div>

            <button onclick="location.reload()" class="text-xs font-bold text-slate-500 hover:text-amber-600 hover:bg-slate-50 flex items-center gap-1 px-2 py-1.5 rounded-md transition-colors" title="別のファイルを読み込む">
                <i data-lucide="file-symlink" class="w-4 h-4"></i> <span class="hidden sm:inline">データ変更</span>
            </button>
        </header>

        <main class="flex-1 w-full max-w-2xl mx-auto flex flex-col p-4 md:pt-6">
            <!-- カテゴリタブ -->
            <div id="tabs" class="flex overflow-x-auto gap-2 pb-2 mb-4 no-scrollbar border-b border-slate-200"></div>
            
            <!-- コントロールバー -->
            <div class="flex justify-between items-center mb-4 text-sm font-bold text-slate-500 px-1">
                <div id="counter" class="bg-slate-200 px-3 py-1 rounded-full text-slate-600">1 / 100</div>
                <div class="flex gap-2">
                    
                    <!-- チェックマークのインポート用隠しinput -->
                    <input type="file" id="import-checked-file" class="hidden" accept=".js,.json,.txt" onchange="handleImportChecked(event)">
                    
                    <!-- インポートボタン (チェック済みタブのみ表示) -->
                    <button id="import-check-btn" onclick="document.getElementById('import-checked-file').click()" class="hidden px-3 py-1 rounded-full bg-slate-50 border border-slate-200 hover:bg-slate-100 flex items-center gap-1.5 transition-colors shadow-sm text-slate-600">
                        <i data-lucide="upload" class="w-4 h-4"></i> <span class="hidden sm:inline">読込</span>
                    </button>

                    <!-- エクスポートボタン (チェック済みタブのみ表示) -->
                    <button id="export-btn" onclick="exportCheckedWords()" class="hidden px-3 py-1 rounded-full bg-amber-50 border border-amber-200 hover:bg-amber-100 flex items-center gap-1.5 transition-colors shadow-sm text-amber-700">
                        <i data-lucide="download" class="w-4 h-4"></i> <span class="hidden sm:inline">保存</span>
                    </button>

                    <button id="shuffle-btn" onclick="shuffleCards()" class="px-3 py-1 rounded-full bg-white border border-slate-200 hover:bg-slate-50 flex items-center gap-1.5 transition-colors shadow-sm">
                        <i data-lucide="shuffle" class="w-4 h-4"></i> シャッフル
                    </button>
                </div>
            </div>

            <!-- =============================== -->
            <!-- 1. カードビュー -->
            <!-- =============================== -->
            <div id="card-view" class="w-full">
                <!-- 空表示 -->
                <div id="card-empty" class="hidden h-80 flex flex-col items-center justify-center bg-white border-2 border-slate-200 border-dashed rounded-2xl text-slate-400 font-bold">
                    <i data-lucide="folder-open" class="w-12 h-12 mb-2 text-slate-300"></i>
                    表示する単語がありません
                </div>

                <div id="flashcard-container" class="h-80 relative perspective-1000 w-full cursor-pointer select-none" onclick="flipCard()">
                    <div id="card-inner" class="relative w-full h-full preserve-3d">
                        
                        <!-- 表面 -->
                        <div class="absolute w-full h-full backface-hidden bg-white border-2 border-slate-200 rounded-2xl shadow-sm p-6 flex flex-col justify-center items-center text-center z-10">
                            <!-- チェックボタン -->
                            <button id="card-front-check" onclick="toggleCardCheck(event)" class="absolute top-4 left-4 p-2 transition-colors z-20">
                                <i data-lucide="bookmark"></i>
                            </button>

                            <span id="card-pos" class="absolute top-4 right-4 text-xs font-bold text-slate-500 bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-md hidden"></span>
                            
                            <!-- innerText/textContent は JS側で安全に注入 -->
                            <h2 id="card-word" class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-6 w-full px-2 break-words"></h2>
                            
                            <button onclick="speakWordText(filteredWords[currentIndex].word, event)" class="p-3 bg-slate-50 rounded-full border border-slate-200 hover:bg-slate-100 text-slate-600 transition-transform active:scale-95 z-20" title="発音を聞く">
                                <i data-lucide="volume-2" class="w-6 h-6"></i>
                            </button>
                            
                            <div class="absolute bottom-5 text-[10px] font-bold text-slate-400 tracking-widest uppercase">
                                タップしてめくる
                            </div>
                        </div>
                        
                        <!-- 裏面 -->
                        <div class="absolute w-full h-full backface-hidden bg-slate-50 border-2 border-slate-200 rounded-2xl shadow-sm p-6 flex flex-col items-center text-center rotate-y-180">
                            <!-- チェックボタン -->
                            <button id="card-back-check" onclick="toggleCardCheck(event)" class="absolute top-4 left-4 p-2 transition-colors z-20">
                                <i data-lucide="bookmark"></i>
                            </button>

                            <div class="w-full h-full flex flex-col items-center justify-center overflow-y-auto px-2">
                                <div class="w-full border-b border-slate-200 pb-2 mb-3">
                                    <h3 id="card-back-word" class="text-sm md:text-base font-bold text-slate-500"></h3>
                                </div>
                                <h2 id="card-meaning" class="text-2xl md:text-3xl font-bold text-amber-700 mb-4 leading-tight"></h2>
                                <div id="card-details" class="flex flex-col gap-2 w-full max-w-sm"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="card-controls" class="flex justify-between mt-6 gap-3">
                    <button id="prev-btn" onclick="prevCard()" class="flex-1 py-3.5 bg-white border-2 border-slate-200 rounded-xl font-bold text-slate-600 hover:bg-slate-50 flex justify-center items-center gap-2 transition-all active:scale-95 shadow-sm">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i> 前へ
                    </button>
                    <button id="next-btn" onclick="nextCard()" class="flex-1 py-3.5 bg-amber-600 border-2 border-amber-700 rounded-xl font-bold text-white hover:bg-amber-700 flex justify-center items-center gap-2 transition-all active:scale-95 shadow-sm">
                        次へ <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <div class="mt-8 text-center text-xs font-bold text-slate-400 hidden md:block">
                    キーボードの [ Space ] でめくる、[ ← ] [ → ] で移動
                </div>
            </div>

            <!-- =============================== -->
            <!-- 2. リストビュー (一覧) -->
            <!-- =============================== -->
            <div id="list-view" class="hidden w-full flex-col pb-8">
                <div id="list-container" class="flex flex-col gap-3">
                    <!-- JSで動的に追加されます -->
                </div>
                
                <!-- 空表示 -->
                <div id="list-empty" class="hidden py-12 flex flex-col items-center justify-center bg-white border-2 border-slate-200 border-dashed rounded-2xl text-slate-400 font-bold mt-2">
                    <i data-lucide="folder-open" class="w-10 h-10 mb-2 text-slate-300"></i>
                    表示する単語がありません
                </div>
            </div>

        </main>
    </div>

    <script>
        // --- 状態管理 ---
        let allWords = [];
        let filteredWords = [];
        let currentIndex = 0;
        let activeCategory = 'all';
        let currentMode = 'card';
        let germanVoice = null;
        
        // localStorageからチェック状態を復元
        let checkedWords = [];
        try {
            const saved = localStorage.getItem('german_checked_words');
            if(saved) checkedWords = JSON.parse(saved);
        } catch(e) {}

        // --- ユーティリティ (HTMLエスケープ) ---
        // < や > などの記号を安全な文字に変換し、HTML崩れを防ぐ
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // --- 初期化 ---
        lucide.createIcons();

        function initVoices() {
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                germanVoice = voices.find(voice => voice.lang.includes('de') || voice.lang.includes('DE'));
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            initVoices();
        }

        // --- メインファイル読み込み ---
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const errorContainer = document.getElementById('upload-error');
            const errorText = document.getElementById('upload-error-text');
            errorContainer.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const match = e.target.result.match(/\[[\s\S]*\]/);
                    if (!match) throw new Error("ファイルの中に単語データ(配列)が見つかりません。");
                    
                    const parsedData = new Function(`return ${match[0]}`)();
                    if (!Array.isArray(parsedData) || parsedData.length === 0) {
                        throw new Error("有効な単語データではありません。");
                    }
                    
                    allWords = parsedData;
                    initApp();
                } catch(err) {
                    errorText.innerText = `読み込みエラー: ${err.message}`;
                    errorContainer.classList.remove('hidden');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        // --- アプリの起動 ---
        function initApp() {
            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            
            buildTabs();
            filterCategory('all');
        }

        // --- タブ生成とフィルタリング ---
        function buildTabs() {
            const categories = [...new Set(allWords.map(w => w.section))];
            const tabsContainer = document.getElementById('tabs');
            tabsContainer.innerHTML = '';
            
            tabsContainer.appendChild(createTabBtn('all', 'すべて'));
            tabsContainer.appendChild(createTabBtn('checked', '🔖 チェック済'));
            
            categories.forEach(cat => {
                const label = typeof cat === 'number' ? `Section ${cat}` : cat;
                tabsContainer.appendChild(createTabBtn(cat, label));
            });
        }

        function createTabBtn(cat, label) {
            const btn = document.createElement('button');
            btn.innerText = label; 
            btn.className = 'tab-btn px-4 py-1.5 rounded-lg font-bold text-sm whitespace-nowrap transition-colors border shadow-sm';
            btn.dataset.cat = cat;
            btn.onclick = () => filterCategory(cat);
            return btn;
        }

        function filterCategory(cat) {
            activeCategory = cat;
            
            if (cat === 'all') {
                filteredWords = [...allWords];
            } else if (cat === 'checked') {
                filteredWords = allWords.filter(w => checkedWords.includes(w.word));
            } else {
                filteredWords = allWords.filter(w => String(w.section) === String(cat));
            }
            
            // タブの見た目
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.cat === String(cat)) {
                    btn.classList.add('bg-amber-600', 'text-white', 'border-amber-700');
                    btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200', 'hover:bg-slate-50');
                } else {
                    btn.classList.remove('bg-amber-600', 'text-white', 'border-amber-700');
                    btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200', 'hover:bg-slate-50');
                }
            });

            // エクスポート＆インポートボタンの表示切り替え（チェック済みタブの時だけ表示）
            const exportBtn = document.getElementById('export-btn');
            const importCheckBtn = document.getElementById('import-check-btn');
            if (cat === 'checked') {
                exportBtn.classList.remove('hidden');
                importCheckBtn.classList.remove('hidden');
            } else {
                exportBtn.classList.add('hidden');
                importCheckBtn.classList.add('hidden');
            }
            
            currentIndex = 0;
            unflipCard();
            
            if (currentMode === 'card') {
                renderCard();
            } else {
                renderList();
            }
            updateGlobalCounter();
        }

        // --- モード切替 ---
        function switchMode(mode) {
            currentMode = mode;
            const cardBtn = document.getElementById('mode-card-btn');
            const listBtn = document.getElementById('mode-list-btn');
            const cardView = document.getElementById('card-view');
            const listView = document.getElementById('list-view');
            const shuffleBtn = document.getElementById('shuffle-btn');

            if (mode === 'card') {
                cardBtn.className = 'px-3 py-1.5 rounded-md bg-white shadow-sm font-bold text-sm text-slate-800 transition-all flex items-center gap-1.5';
                listBtn.className = 'px-3 py-1.5 rounded-md text-slate-500 font-bold text-sm hover:text-slate-700 transition-all flex items-center gap-1.5';
                cardView.classList.remove('hidden');
                listView.classList.add('hidden');
                shuffleBtn.classList.remove('hidden');
                renderCard();
            } else {
                listBtn.className = 'px-3 py-1.5 rounded-md bg-white shadow-sm font-bold text-sm text-slate-800 transition-all flex items-center gap-1.5';
                cardBtn.className = 'px-3 py-1.5 rounded-md text-slate-500 font-bold text-sm hover:text-slate-700 transition-all flex items-center gap-1.5';
                cardView.classList.add('hidden');
                listView.classList.remove('hidden');
                shuffleBtn.classList.add('hidden');
                renderList();
            }
            updateGlobalCounter();
        }

        function updateGlobalCounter() {
            const counter = document.getElementById('counter');
            if (filteredWords.length === 0) {
                counter.innerText = `0 / 0`;
            } else if (currentMode === 'card') {
                counter.innerText = `${currentIndex + 1} / ${filteredWords.length}`;
            } else {
                counter.innerText = `全 ${filteredWords.length} 件`;
            }
        }


        // --- チェック機能 (しおり) ---
        function toggleCheck(wordStr) {
            if (checkedWords.includes(wordStr)) {
                checkedWords = checkedWords.filter(w => w !== wordStr);
            } else {
                checkedWords.push(wordStr);
            }
            localStorage.setItem('german_checked_words', JSON.stringify(checkedWords));
            
            if (activeCategory === 'checked') {
                filteredWords = allWords.filter(w => checkedWords.includes(w.word));
                if (currentMode === 'card') {
                    if (currentIndex >= filteredWords.length) currentIndex = Math.max(0, filteredWords.length - 1);
                    unflipCard();
                    setTimeout(renderCard, 150);
                } else {
                    renderList();
                }
                updateGlobalCounter();
            } else {
                if (currentMode === 'card') updateCardCheckUI();
                else renderList(); 
            }
        }

        function toggleCardCheck(event) {
            if (event) event.stopPropagation();
            if (filteredWords.length === 0) return;
            toggleCheck(filteredWords[currentIndex].word);
        }

        function toggleCheckList(index) {
            const wordStr = filteredWords[index].word;
            toggleCheck(wordStr);
        }

        function updateCardCheckUI() {
            if (filteredWords.length === 0) return;
            const wordStr = filteredWords[currentIndex].word;
            const isChecked = checkedWords.includes(wordStr);
            
            const iconName = isChecked ? 'bookmark-check' : 'bookmark';
            const iconColor = isChecked ? 'text-amber-600' : 'text-slate-300';
            
            ['card-front-check', 'card-back-check'].forEach(id => {
                const btn = document.getElementById(id);
                btn.className = `absolute top-4 left-4 p-2 transition-colors z-20 hover:text-amber-500 ${iconColor}`;
                btn.innerHTML = `<i data-lucide="${iconName}"></i>`;
            });
            lucide.createIcons();
        }

        // --- チェック状態のエクスポート ---
        function exportCheckedWords() {
            const exportData = allWords.filter(w => checkedWords.includes(w.word));
            if (exportData.length === 0) {
                alert("エクスポートする単語がありません。");
                return;
            }

            const jsonString = JSON.stringify(exportData, null, 2);
            const jsContent = `const germanWords = ${jsonString};`;
            const blob = new Blob([jsContent], { type: 'text/javascript;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'checked_words.js'; 
            document.body.appendChild(link);
            link.click();
            
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // --- チェック状態のインポート (マージ) ---
        function handleImportChecked(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const match = e.target.result.match(/\[[\s\S]*\]/);
                    if (!match) throw new Error("配列データが見つかりません。");
                    
                    const parsedData = new Function(`return ${match[0]}`)();
                    if (!Array.isArray(parsedData)) throw new Error("有効なデータではありません。");

                    // エクスポートファイルはオブジェクトの配列になっているため、wordプロパティのみを抽出
                    const importedWords = parsedData.map(item => 
                        (typeof item === 'object' && item !== null) ? item.word : String(item)
                    ).filter(Boolean);

                    if (importedWords.length === 0) {
                        alert("読み込めるチェックデータがありませんでした。");
                        return;
                    }

                    // 既存のチェックデータと結合し、重複を排除
                    checkedWords = [...new Set([...checkedWords, ...importedWords])];
                    localStorage.setItem('german_checked_words', JSON.stringify(checkedWords));

                    alert(`${importedWords.length}件の単語のチェック状態を復元しました。`);

                    // 画面を再描画
                    filterCategory(activeCategory);
                    
                } catch(err) {
                    alert(`チェックデータのインポートに失敗しました: ${err.message}`);
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Inputリセット
        }


        // --- カードビュー制御 ---
        function renderCard() {
            const container = document.getElementById('flashcard-container');
            const controls = document.getElementById('card-controls');
            const emptyState = document.getElementById('card-empty');

            if (filteredWords.length === 0) {
                container.classList.add('hidden');
                controls.classList.add('hidden');
                emptyState.classList.remove('hidden');
                updateGlobalCounter();
                return;
            }
            
            container.classList.remove('hidden');
            controls.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            const word = filteredWords[currentIndex];
            updateGlobalCounter();
            updateCardCheckUI();
            
            // 表面 (安全に挿入)
            document.getElementById('card-word').textContent = word.word;
            const posEl = document.getElementById('card-pos');
            if (word.part_of_speech) {
                posEl.textContent = word.part_of_speech;
                posEl.classList.remove('hidden');
            } else {
                posEl.classList.add('hidden');
            }
            
            // 裏面
            document.getElementById('card-back-word').textContent = word.word;
            document.getElementById('card-meaning').textContent = word.meaning;
            
            const detailsContainer = document.getElementById('card-details');
            detailsContainer.innerHTML = '';
            
            if (word.plural_or_conjugation) {
                detailsContainer.innerHTML += `
                    <div class="bg-white px-3 py-2 border border-slate-200 rounded-lg text-sm font-bold text-slate-600 text-left w-full">
                        <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-0.5">複数形・変化</div>
                        ${escapeHTML(word.plural_or_conjugation)}
                    </div>
                `;
            }
            if (word.notes) {
                detailsContainer.innerHTML += `
                    <div class="bg-amber-50/50 px-3 py-2 border border-amber-200/60 rounded-lg text-sm font-bold text-amber-800 leading-relaxed text-left w-full mt-1">
                        <div class="text-[10px] text-amber-500 uppercase tracking-wider mb-0.5">ノート</div>
                        ${escapeHTML(word.notes)}
                    </div>
                `;
            }
            
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            prevBtn.disabled = currentIndex === 0;
            prevBtn.style.opacity = currentIndex === 0 ? '0.4' : '1';
            
            nextBtn.disabled = currentIndex === filteredWords.length - 1;
            nextBtn.style.opacity = currentIndex === filteredWords.length - 1 ? '0.4' : '1';
        }

        function flipCard() {
            document.getElementById('card-inner').classList.toggle('flipped');
        }

        function unflipCard() {
            document.getElementById('card-inner').classList.remove('flipped');
        }

        function nextCard() {
            if (currentIndex < filteredWords.length - 1) {
                unflipCard();
                setTimeout(() => { currentIndex++; renderCard(); }, 150);
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                unflipCard();
                setTimeout(() => { currentIndex--; renderCard(); }, 150);
            }
        }

        function shuffleCards() {
            unflipCard();
            setTimeout(() => {
                for (let i = filteredWords.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filteredWords[i], filteredWords[j]] = [filteredWords[j], filteredWords[i]];
                }
                currentIndex = 0;
                renderCard();
            }, 150);
        }

        // --- リストビュー制御 ---
        function renderList() {
            const container = document.getElementById('list-container');
            const emptyState = document.getElementById('list-empty');
            container.innerHTML = '';

            if (filteredWords.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');
            
            filteredWords.forEach((word, index) => {
                const isChecked = checkedWords.includes(word.word);
                const checkIcon = isChecked ? 'bookmark-check' : 'bookmark';
                const checkColor = isChecked ? 'text-amber-600' : 'text-slate-300 hover:text-amber-500';

                const sectionStr = typeof word.section === 'number' ? `Sec ${word.section}` : word.section;

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow relative">
                        <div class="absolute top-4 right-4 flex gap-1">
                            <button onclick="speakWordTextList(${index}, event)" class="p-1.5 text-slate-400 hover:text-slate-600 transition-colors bg-slate-50 hover:bg-slate-100 rounded-md">
                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                            </button>
                            <button onclick="toggleCheckList(${index})" class="p-1.5 ${checkColor} transition-colors bg-slate-50 hover:bg-slate-100 rounded-md">
                                <i data-lucide="${checkIcon}" class="w-5 h-5"></i>
                            </button>
                        </div>
                        
                        <!-- タグ -->
                        <div class="flex flex-wrap gap-2 mb-3 pr-20">
                            <span class="text-[10px] font-bold text-slate-500 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded uppercase tracking-wider">${escapeHTML(sectionStr)}</span>
                            ${word.part_of_speech ? `<span class="text-[10px] font-bold text-slate-500 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded uppercase tracking-wider">${escapeHTML(word.part_of_speech)}</span>` : ''}
                        </div>
                        
                        <!-- 翻訳表示 -->
                        <div class="mb-1 text-xl md:text-2xl font-extrabold text-slate-800 pr-20">${escapeHTML(word.word)}</div>
                        <div class="mb-3 text-base md:text-lg font-bold text-amber-700">${escapeHTML(word.meaning)}</div>
                        
                        <!-- 詳細 -->
                        <div class="flex flex-col gap-1.5">
                            ${word.plural_or_conjugation ? `
                                <div class="text-sm font-bold text-slate-600 bg-slate-50 border border-slate-100 px-2.5 py-1.5 rounded-lg flex flex-col sm:flex-row sm:items-baseline gap-1">
                                    <span class="text-[10px] text-slate-400 uppercase tracking-wider shrink-0 border border-slate-200 px-1 rounded-sm bg-white">変化</span>
                                    <span>${escapeHTML(word.plural_or_conjugation)}</span>
                                </div>
                            ` : ''}
                            ${word.notes ? `
                                <div class="text-sm font-bold text-amber-800 bg-amber-50/50 border border-amber-100 px-2.5 py-1.5 rounded-lg flex flex-col sm:flex-row sm:items-baseline gap-1">
                                    <span class="text-[10px] text-amber-500 uppercase tracking-wider shrink-0 border border-amber-200/60 px-1 rounded-sm bg-white">Note</span>
                                    <span class="leading-relaxed">${escapeHTML(word.notes)}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // --- 音声再生 ---
        function speakWordTextList(index, event) {
            if(event) event.stopPropagation();
            const text = filteredWords[index].word;
            speakWordText(text, event);
        }

        function speakWordText(text, event) {
            if(event) event.stopPropagation(); 
            if (!('speechSynthesis' in window)) {
                alert("音声読み上げ非対応ブラウザです。");
                return;
            }
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            if (germanVoice) utterance.voice = germanVoice;
            utterance.rate = 0.85; 
            
            setTimeout(() => window.speechSynthesis.speak(utterance), 50);
        }

        // --- キーボード＆スワイプ (カード時のみ) ---
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('app-section').classList.contains('hidden')) return;
            if (currentMode !== 'card') return; 
            
            if (e.code === 'Space' || e.key === 'Enter') {
                e.preventDefault(); flipCard();
            } else if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                prevCard();
            }
        });

        let touchStartX = 0, touchEndX = 0;
        const flashcardContainer = document.getElementById('flashcard-container');

        flashcardContainer.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        flashcardContainer.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) nextCard();
            else if (touchStartX - touchEndX < -50) prevCard();
        }, { passive: true });
    </script>
</body>
</html>
